benchmark_id: yearn_vault_v3
scenarios:
  - name: initialize
    state_access_profile: cold
    measured:
      data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
    expect_success: true
    observers: &yearn_observers
      - data: 'abi.encodeWithSignature("totalAssets()")'
      - data: 'abi.encodeWithSignature("totalSupply()")'
      - data: 'abi.encodeWithSignature("balanceOf(address)", address(this))'
      - data: 'abi.encodeWithSignature("balanceOf(address)", BOB)'
      - data: 'abi.encodeWithSignature("pricePerShare()")'
      - data: 'abi.encodeWithSignature("maxDeposit(address)", address(this))'
      - data: 'abi.encodeWithSignature("maxWithdraw(address,uint256)", address(this), uint256(10_000))'
      - data: 'abi.encodeWithSignature("strategyState(address)", address(0x5151))'
      - data: 'abi.encodeWithSignature("nonces(address)", address(this))'
  - name: deposit
    state_access_profile: mixed
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    expect_success: true
    observers: *yearn_observers
  - name: withdraw_idle
    state_access_profile: mixed
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(100_000), address(this))'
    measured:
      data: 'abi.encodeWithSignature("withdraw(uint256,address,address,uint256)", uint256(20_000), address(this), address(this), uint256(0))'
    expect_success: true
    observers: *yearn_observers
  - name: strategy_profit_report
    state_access_profile: mixed
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", address(0x5151), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", address(0x5151), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", address(0x5151), uint256(100_000), uint256(0))'
      - data: 'abi.encodeWithSignature("mock_strategy_report(address,uint256,uint256)", address(0x5151), uint256(10_000), uint256(0))'
    measured:
      data: 'abi.encodeWithSignature("process_report(address)", address(0x5151))'
    expect_success: true
    observers: *yearn_observers
  - name: strategy_loss_withdraw
    state_access_profile: mixed
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(200_000), address(this))'
      - data: 'abi.encodeWithSignature("add_strategy(address,bool)", address(0x5151), true)'
      - data: 'abi.encodeWithSignature("update_max_debt_for_strategy(address,uint256)", address(0x5151), uint256(150_000))'
      - data: 'abi.encodeWithSignature("update_debt(address,uint256,uint256)", address(0x5151), uint256(150_000), uint256(0))'
      - data: 'abi.encodeWithSignature("mock_strategy_report(address,uint256,uint256)", address(0x5151), uint256(0), uint256(5_000))'
      - data: 'abi.encodeWithSignature("process_report(address)", address(0x5151))'
    measured:
      data: 'abi.encodeWithSignature("withdraw(uint256,address,address,uint256)", uint256(120_000), address(this), address(this), uint256(1_000))'
    expect_success: true
    observers: *yearn_observers
  - name: shutdown_rejects_deposit
    state_access_profile: warm
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
      - data: 'abi.encodeWithSignature("shutdown_vault()")'
    measured:
      data: 'abi.encodeWithSignature("deposit(uint256,address)", uint256(1), address(this))'
    expect_success: false
    observers: *yearn_observers
  - name: permit_digest
    state_access_profile: cold
    setup:
      - data: 'abi.encodeWithSignature("initialize(uint256,uint256,uint256)", uint256(1_000_000), uint256(86400), uint256(1000))'
    measured:
      data: 'abi.encodeWithSignature("permitDigest(address,address,uint256,uint256)", address(this), BOB, uint256(123), uint256(999999))'
    expect_success: true
    observers: *yearn_observers
