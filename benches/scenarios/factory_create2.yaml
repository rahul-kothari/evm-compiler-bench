benchmark_id: factory_create2
scenarios:
  - name: init_code_hash
    state_access_profile: cold
    measured:
      data: 'abi.encodeWithSignature("initCodeHash(uint256)", uint256(7))'
    expect_success: true
  - name: deploy_value
    state_access_profile: warm
    warmup:
      - data: 'abi.encodeWithSignature("deployedValue(bytes32)", SALT)'
    measured:
      data: 'abi.encodeWithSignature("deploy(bytes32,uint256)", SALT, uint256(7))'
    expect_success: true
    observers:
      - data: 'abi.encodeWithSignature("deployedValue(bytes32)", SALT)'
  - name: deployed_value
    state_access_profile: mixed
    setup:
      - data: 'abi.encodeWithSignature("deploy(bytes32,uint256)", SALT, uint256(7))'
    warmup:
      - data: 'abi.encodeWithSignature("deployedValue(bytes32)", SALT)'
    measured:
      data: 'abi.encodeWithSignature("deployedValue(bytes32)", SALT)'
    expect_success: true
    observers:
      - data: 'abi.encodeWithSignature("deployedValue(bytes32)", SALT)'
