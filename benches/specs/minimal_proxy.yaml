id: minimal_proxy
title: Minimal Proxy
abi:
  - "proxyCodeHash(address) returns (bytes32)"
  - "predictClone(address,bytes32) returns (address)"
  - "cloneAndSet(address,bytes32,uint256) returns (uint256)"
  - "cloneValue(bytes32) returns (uint256)"
semantics:
  - "Exercises EIP-1167 bytecode hashing and salt-indexed clone bookkeeping."
  - "The MVP records clone state instead of deploying cross-language proxy targets."
scenarios:
  - name: proxy_code_hash
    call: "proxyCodeHash(implementation)"
    expected: "returns EIP-1167 bytecode hash"
  - name: clone_and_set
    call: "cloneAndSet(implementation, salt, 42)"
    expected: "stores clone value"
  - name: clone_value
    call: "cloneValue(salt)"
    expected: "returns stored value"
implementations:
  solidity: "benches/implementations/minimal_proxy/solidity/MinimalProxy.sol"
  vyper: "benches/implementations/minimal_proxy/vyper/MinimalProxy.vy"
